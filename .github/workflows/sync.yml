# 扫 npm 上的 Cortico 扩展,用 GitHub App 给新包开讨论帖,提交 catalog.json、packages/、assets/ 与 comments/ 快照。
# 标题是 `[sync] 包名` / `[同步] 包名` 的 issue 开出或重新打开时马上跑一次,扫完回帖并关闭(scripts/sync-requests.mjs)。
name: Sync catalog and discussions

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    # 别的 issue 不跑。表达式里的 contains 不分大小写;标题由脚本按前缀再认一遍,issue 内容不进 shell。
    if: >-
      github.event_name != 'issues' || (!github.event.issue.pull_request
      && (contains(github.event.issue.title, 'sync') || contains(github.event.issue.title, '同步')))
    # 放在 job 上:被上面跳过的运行不占队列,不会把排着的那次挤掉
    concurrency:
      group: sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 检出分支最新提交而不是触发时的提交,重跑旧的运行也从上一次生成的数据接着算。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Scan npm
        run: node scripts/scan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: GitHub App installation token
        id: app
        run: node scripts/app-token.mjs
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Discussions and comment snapshots
        run: node scripts/discussions.mjs
        env:
          GH_APP_TOKEN: ${{ steps.app.outputs.token }}

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -q -m 'Sync catalog and comment snapshots'
          git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"

      - name: Answer sync requests
        run: node scripts/sync-requests.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
