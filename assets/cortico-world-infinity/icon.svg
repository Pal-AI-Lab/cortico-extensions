<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="orb" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#f2eeff"/>
      <stop offset="34%" stop-color="#b9a9ff"/>
      <stop offset="66%" stop-color="#7b68ee"/>
      <stop offset="100%" stop-color="#2a1f5e"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#8b7cf6" stop-opacity="0"/>
      <stop offset="86%" stop-color="#8b7cf6" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0644f"/>
      <stop offset="100%" stop-color="#8a2b2b"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0d0a18"/>
  <circle cx="32" cy="32" r="31" fill="url(#halo)"/>

  <!-- 主神光球 -->
  <circle cx="32" cy="29" r="12.5" fill="url(#orb)"/>
  <ellipse cx="27.4" cy="23.6" rx="4.4" ry="3.1" fill="#ffffff" opacity=".5" transform="rotate(-24 27.4 23.6)"/>

  <!-- 无限符号：轮回 -->
  <path d="M18.5 48.5c-3.4 0-5.4-2.2-5.4-5s2-5 5.4-5c4.6 0 6.6 10 13.5 10s8.9-10 13.5-10c3.4 0 5.4 2.2 5.4 5s-2 5-5.4 5c-4.6 0-6.6-10-13.5-10s-8.9 10-13.5 10Z"
        fill="none" stroke="url(#loop)" stroke-width="2.4" stroke-linecap="round" opacity=".95"/>

  <!-- 三个刻度：三个世界 -->
  <g fill="#b9a9ff" opacity=".8">
    <circle cx="30" cy="29" r="1.1"/>
    <circle cx="37.5" cy="26" r="1.1"/>
    <circle cx="34" cy="34.5" r="1.1"/>
  </g>
</svg>
