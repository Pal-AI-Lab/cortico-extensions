<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="技能宿主">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6ea8"/>
      <stop offset="1" stop-color="#1d3f66"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- 槽位：一个插座，技能从上面插进来 -->
  <rect x="46" y="22" width="36" height="14" rx="5" fill="#cfe6ff" opacity="0.9"/>
  <rect x="52" y="26" width="6" height="26" rx="3" fill="#cfe6ff" opacity="0.9"/>
  <rect x="70" y="26" width="6" height="26" rx="3" fill="#cfe6ff" opacity="0.9"/>
  <!-- 宿主本体 -->
  <rect x="30" y="52" width="68" height="52" rx="12" fill="#eaf4ff"/>
  <circle cx="64" cy="78" r="15" fill="#1d3f66"/>
  <circle cx="64" cy="78" r="6" fill="#6fb3ff"/>
  <rect x="42" y="96" width="44" height="4" rx="2" fill="#9fc3e8"/>
</svg>
